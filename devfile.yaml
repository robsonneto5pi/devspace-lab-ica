schemaVersion: 2.2.0
metadata:
  name: devspace-lab-ica
attributes:
  controller.devfile.io/storage-type: ephemeral

components:
  - name: udi
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 4Gi
      memoryRequest: 512Mi
      cpuLimit: "2"
      cpuRequest: 100m
      mountSources: true
      sourceMapping: /projects
      env:
        # LLM local (Ramalama) acessivel pelos agentes dentro do pod
        - name: LOCAL_LLM_BASE_URL
          value: 'http://localhost:8080/v1'
        - name: LOCAL_LLM_MODEL
          value: 'qwen2.5-coder:3b'

  # LLM local, sem API key. Servido em 8080 (rede do pod e compartilhada).
  - name: ramalama
    container:
      image: quay.io/ramalama/ramalama:latest
      memoryLimit: 4Gi
      memoryRequest: 512Mi
      cpuLimit: "2"
      cpuRequest: 200m
      env:
        - name: HOME
          value: /models
      args:
        - "ramalama"
        - "--nocontainer"
        - "--store"
        - "/models"
        - "serve"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "ollama://qwen2.5-coder:3b"
      volumeMounts:
        - name: ramalama-models
          path: /models

  - name: ramalama-models
    volume:
      size: 8Gi

commands:
  - id: copyconfig
    exec:
      component: udi
      commandLine: "mkdir -p /home/user/.continue && curl -fsSL https://raw.githubusercontent.com/remingtonsb/cde-ramalama-continue/master/continue-config.yaml -o /home/user/.continue/config.yaml && echo 'OK Continue config'"

  # Coding Agents (claude, codex, opencode, cline): instala as CLIs, ajusta PATH
  # e configura Codex/Claude Code. As chaves chegam como env vars pelo Secret
  # 'agents-env' (ver README-AGENTS.md). Ver scripts/setup-agents.sh.
  - id: install-agents
    exec:
      component: udi
      commandLine: "bash /projects/devspace-lab-ica/scripts/setup-agents.sh"
